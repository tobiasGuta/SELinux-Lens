[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selinux-lens"
version = "0.1.0"
description = "Read-only native GNOME SELinux AVC investigation interface"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SELinux Lens contributors"}]
keywords = ["fedora", "selinux", "audit", "gnome", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.scripts]
selinux-lens = "selinux_lens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
